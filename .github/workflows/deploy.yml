name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          # A configuração do SDK Web identifica o projeto, mas não concede
          # acesso aos dados. A autorização continua protegida pelas regras
          # do Firestore e pelo Firebase Authentication.
          VITE_FIREBASE_API_KEY: AIzaSyCxOwqoBu93fXD-3NHdzRuEdM2iKTT3TYM
          VITE_FIREBASE_AUTH_DOMAIN: finance-app-dd4b9.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: finance-app-dd4b9
          VITE_FIREBASE_STORAGE_BUCKET: finance-app-dd4b9.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '93185529835'
          VITE_FIREBASE_APP_ID: '1:93185529835:web:07c535ff2c460f5e48ebae'
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
